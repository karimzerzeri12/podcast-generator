# One-command run for a VM (e.g. Oracle Cloud Always Free). See DEPLOY.md.
#
#   docker compose up -d --build
#
# Persistence: the ./data folder on the host is mounted into the container as its storage
# dir, so the SQLite database, generated scripts/audio, and vector index survive container
# restarts, rebuilds, and reboots. Nothing resets.
services:
  app:
    build: .
    image: podcast-generator
    ports:
      # host:container — visitors reach the app at http://<server-ip>/ (host port 80).
      - "80:7860"
    env_file:
      # secrets + config live here, on the host, never baked into the image (see DEPLOY.md)
      - .env.production
    volumes:
      # persistent storage: DB + scripts + audio + chroma vectors live on the host disk
      - ./data:/app/storage
    restart: unless-stopped
